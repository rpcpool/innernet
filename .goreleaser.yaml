# .goreleaser.yaml for rpcpool/innernet
#
# This file must be committed to the root of the innernet source repo.
# GCS upload, cosigning, and GitHub Release publishing are injected via
# ci/goreleaser-patch.yaml in Binaries-ci at build time.
#
# Both workspace packages are built in a single cargo build invocation
# via before.hooks (avoids cargo file-lock contention from parallel builds).
# Each build entry then uses tool:/bin/true so goreleaser skips cargo entirely
# and picks up the already-compiled binaries from the target directory.
#
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
    hooks:
        - cargo build --release --target x86_64-unknown-linux-gnu --package=innernet --package=innernet-server

builds:
    - id: innernet
      builder: rust
      tool: /bin/true
      binary: innernet
      targets:
          - x86_64-unknown-linux-gnu
      flags:
          - --package=innernet

    - id: innernet-server
      builder: rust
      tool: /bin/true
      binary: innernet-server
      targets:
          - x86_64-unknown-linux-gnu
      flags:
          - --package=innernet-server

archives:
    - id: innernet
      ids: [innernet]
      name_template: innernet-linux-amd64
      formats: [binary]

    - id: innernet-server
      ids: [innernet-server]
      name_template: innernet-server-linux-amd64
      formats: [binary]

release:
    github:
        owner: rpcpool
        name: innernet
    draft: true
    header: |
        rust {{ .Env.RUST_VERSION }}

changelog:
    sort: asc
    use: github
